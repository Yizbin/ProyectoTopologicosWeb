<div class="min-h-screen bg-[#f6f5f0] text-[#23312b] flex flex-col">
  <header class="border-b border-stone-200/80 bg-[#23312b] text-[#f6f5f0]">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3.5 sm:px-6">
      <div class="flex items-center gap-3">
        <span
          class="flex h-9 w-9 items-center justify-center rounded-lg border border-[#e4b390]/35 bg-[#526e5c] text-xs font-bold tracking-tight text-white">
          <svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
        </span>
        <div>
          <h1 class="text-sm font-semibold tracking-tight text-white sm:text-base">
            {{ title() }}
          </h1>
          <p class="text-[11px] font-medium uppercase tracking-[0.14em] text-[#e4b390]">
            Backoffice operativo
          </p>
        </div>
      </div>


    </div>
  </header>

  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6">
    <div class="rounded-2xl border border-stone-200 bg-white p-6 shadow-xs">
      <div class="pt-4">
        <router-outlet />
      </div>
    </div>
  </main>
</div>
