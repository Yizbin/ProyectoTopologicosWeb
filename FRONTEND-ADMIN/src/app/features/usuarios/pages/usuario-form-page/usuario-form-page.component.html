<div class="mx-auto max-w-2xl space-y-6">
  <div>
    <a
      routerLink="/usuarios"
      class="inline-flex items-center gap-1.5 text-sm font-medium text-stone-600 hover:text-stone-900"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
      Volver a usuarios
    </a>
    <h1 class="mt-2 text-2xl font-bold tracking-tight text-stone-900">
      Nuevo usuario
    </h1>
    <p class="mt-1 text-sm text-stone-600">
      Da de alta un cliente para reservaciones manuales o un nuevo operador administrativo.
    </p>
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="space-y-5 rounded-2xl border border-stone-200 bg-white p-6 shadow-sm"
  >
    <app-domain-error-alert [error]="submitError()" />

    <div>
      <label for="usr-nombre" class="block text-sm font-semibold text-stone-800">
        Nombre completo
      </label>
      <input
        id="usr-nombre"
        type="text"
        formControlName="nombre"
        placeholder="Ej. Laura Mendoza"
        class="mt-1.5 block w-full rounded-lg border px-3 py-2 text-sm text-stone-900 placeholder:text-stone-400 focus:outline-none focus:ring-2"
        [class]="
          hasFieldError('nombre')
            ? 'border-red-500 focus:border-red-600 focus:ring-red-200'
            : 'border-stone-300 focus:border-[#23312b] focus:ring-[#23312b]/20'
        "
      />
      <app-field-error [control]="form.controls.nombre" fieldName="nombre" />
    </div>

    <div>
      <label for="usr-correo" class="block text-sm font-semibold text-stone-800">
        Correo electrónico
      </label>
      <input
        id="usr-correo"
        type="email"
        formControlName="correo"
        placeholder="laura@correo.com"
        class="mt-1.5 block w-full rounded-lg border px-3 py-2 text-sm text-stone-900 placeholder:text-stone-400 focus:outline-none focus:ring-2"
        [class]="
          hasFieldError('correo')
            ? 'border-red-500 focus:border-red-600 focus:ring-red-200'
            : 'border-stone-300 focus:border-[#23312b] focus:ring-[#23312b]/20'
        "
      />
      <app-field-error [control]="form.controls.correo" fieldName="correo" />
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <div>
        <label for="usr-telefono" class="block text-sm font-semibold text-stone-800">
          Teléfono
        </label>
        <input
          id="usr-telefono"
          type="tel"
          formControlName="telefono"
          placeholder="5551234567"
          class="mt-1.5 block w-full rounded-lg border px-3 py-2 text-sm text-stone-900 placeholder:text-stone-400 focus:outline-none focus:ring-2"
          [class]="
            hasFieldError('telefono')
              ? 'border-red-500 focus:border-red-600 focus:ring-red-200'
              : 'border-stone-300 focus:border-[#23312b] focus:ring-[#23312b]/20'
          "
        />
        <app-field-error [control]="form.controls.telefono" fieldName="teléfono" />
      </div>

      <div>
        <label for="usr-form-rol" class="block text-sm font-semibold text-stone-800">
          Rol
        </label>
        <select
          id="usr-form-rol"
          formControlName="rol"
          class="mt-1.5 block w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm text-stone-900 focus:border-[#23312b] focus:outline-none focus:ring-2 focus:ring-[#23312b]/20"
        >
          <option value="CLIENTE">CLIENTE</option>
          <option value="ADMIN">ADMIN</option>
        </select>
        <app-field-error [control]="form.controls.rol" fieldName="rol" />
      </div>
    </div>

    <div>
      <label for="usr-contrasena" class="block text-sm font-semibold text-stone-800">
        Contraseña inicial
      </label>
      <input
        id="usr-contrasena"
        type="password"
        formControlName="contrasena"
        placeholder="Mínimo 6 caracteres"
        class="mt-1.5 block w-full rounded-lg border px-3 py-2 text-sm text-stone-900 placeholder:text-stone-400 focus:outline-none focus:ring-2"
        [class]="
          hasFieldError('contrasena')
            ? 'border-red-500 focus:border-red-600 focus:ring-red-200'
            : 'border-stone-300 focus:border-[#23312b] focus:ring-[#23312b]/20'
        "
      />
      <app-field-error
        [control]="form.controls.contrasena"
        fieldName="contraseña"
      />
    </div>

    <div class="flex flex-wrap items-center justify-end gap-3 border-t border-stone-100 pt-4">
      <a
        routerLink="/usuarios"
        class="rounded-lg border border-stone-300 bg-white px-4 py-2 text-sm font-medium text-stone-700 hover:bg-stone-50"
      >
        Cancelar
      </a>
      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="inline-flex items-center justify-center gap-2 rounded-lg bg-[#23312b] px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-[#354b42] disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (isSubmitting()) {
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
        }
        Crear usuario
      </button>
    </div>
  </form>
</div>
