@if (isLoading()) {
<section role="status" aria-live="polite" aria-busy="true"
  class="rounded-2xl border border-stone-200/90 bg-white p-6 shadow-xs">
  <div class="flex items-center gap-3">
    <span aria-hidden="true"
      class="inline-block h-5 w-5 animate-spin rounded-full border-2 border-stone-300 border-t-[#526e5c]"></span>
    <p class="m-0 text-sm font-medium text-stone-700">
      {{ loadingMessage() }}
    </p>
  </div>

  <div class="mt-5 space-y-3 animate-pulse" aria-hidden="true">
    <div class="h-4 w-1/3 rounded-md bg-stone-200/80"></div>
    <div class="h-10 w-full rounded-xl bg-stone-200/60"></div>
    <div class="h-10 w-full rounded-xl bg-stone-200/50"></div>
    <div class="h-10 w-4/5 rounded-xl bg-stone-200/40"></div>
  </div>
</section>
} @else if (error()?.statusCode === 404) {
<app-not-found [backLink]="backLink()" [backLabel]="backLabel()" />
} @else if (error(); as currentError) {
<div class="space-y-3">
  <app-domain-error-alert [error]="currentError" />
  <div class="flex justify-end">
    <button type="button" (click)="retry.emit()"
      class="inline-flex items-center gap-2 rounded-xl bg-[#23312b] px-4 py-2 text-sm font-semibold text-white transition hover:bg-[#354b42]">
      <svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
      Reintentar
    </button>
  </div>
</div>
} @else if (isEmpty()) {
<section aria-live="polite"
  class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-stone-300 bg-white/80 px-6 py-12 text-center">
  <div aria-hidden="true"
    class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-[#e4e9e0] text-[#526e5c]">
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
      stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <path d="M3 10h18" />
      <path d="M8 2v4" />
      <path d="M16 2v4" />
    </svg>
  </div>

  <h3 class="m-0 text-base font-semibold text-stone-900">
    {{ emptyTitle() }}
  </h3>
  <p class="mt-1.5 mb-0 max-w-md text-sm leading-relaxed text-stone-600">
    {{ emptyMessage() }}
  </p>

  <div class="mt-5 empty:hidden">
    <ng-content select="[emptyAction]" />
  </div>
</section>
} @else {
<ng-content />
}
