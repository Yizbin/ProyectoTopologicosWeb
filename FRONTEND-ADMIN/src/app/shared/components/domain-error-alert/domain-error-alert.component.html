@if (error(); as err) {
<div role="alert" class="rounded-xl border border-red-200 bg-red-50/95 p-4 text-sm text-red-950">
  <div class="flex items-start justify-between gap-3">
    <div class="flex items-start gap-3">
      <div aria-hidden="true"
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-red-100 text-red-700">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
      </div>

      <div class="space-y-1">
        <div class="flex flex-wrap items-center gap-2">
          <h3 class="m-0 text-sm font-semibold text-red-900">
            {{ title() }}
          </h3>
          <span
            class="inline-flex items-center rounded-full bg-red-100 px-2 py-0.5 font-mono text-[11px] font-medium text-red-800 ring-1 ring-inset ring-red-200">
            {{ err.tipoError }}
          </span>
        </div>

        <p class="m-0 text-xs leading-relaxed text-red-800 sm:text-sm">
          {{ formattedMessage() }}
        </p>

        @if (err.details && err.details.length > 1) {
        <ul class="mt-1.5 list-disc space-y-0.5 pl-4 text-xs text-red-800">
          @for (item of err.details; track item) {
          <li>{{ item }}</li>
          }
        </ul>
        }
      </div>
    </div>

    @if (dismissible()) {
    <button type="button" aria-label="Cerrar alerta" (click)="dismissed.emit()"
      class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg text-red-600 transition hover:bg-red-100 hover:text-red-900">
      <svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
    }
  </div>
</div>
}
