<nav aria-label="Paginación de registros"
  class="flex flex-col gap-3 rounded-2xl border border-stone-200 bg-white px-4 py-3 sm:flex-row sm:items-center sm:justify-between">
  <p class="m-0 text-xs font-medium text-stone-600">
    {{ rangeSummary() }}
  </p>

  <div class="flex flex-wrap items-center gap-1.5">
    <button type="button" [disabled]="page() <= 1" (click)="goToPage(page() - 1)"
      class="inline-flex items-center gap-1 rounded-xl border border-stone-300 bg-white px-3 py-1.5 text-xs font-semibold text-stone-700 transition hover:bg-stone-100 disabled:cursor-not-allowed disabled:opacity-45">
      Anterior
    </button>

    @for (p of visiblePages(); track p) {
    <button type="button" [attr.aria-current]="p === page() ? 'page' : null" (click)="goToPage(p)"
      class="inline-flex h-8 min-w-8 items-center justify-center rounded-xl px-2.5 text-xs font-semibold transition"
      [class]="
          p === page()
            ? 'bg-[#23312b] text-white'
            : 'border border-stone-200 bg-stone-50 text-stone-700 hover:bg-stone-100'
        ">
      {{ p }}
    </button>
    }

    <button type="button" [disabled]="page() >= safeTotalPages()" (click)="goToPage(page() + 1)"
      class="inline-flex items-center gap-1 rounded-xl border border-stone-300 bg-white px-3 py-1.5 text-xs font-semibold text-stone-700 transition hover:bg-stone-100 disabled:cursor-not-allowed disabled:opacity-45">
      Siguiente
    </button>
  </div>
</nav>
